<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safa Omra — Pré-Réservation Ramadan 2027</title>

  <!-- ══ WhatsApp / réseaux sociaux ══ -->
  <meta property="og:type"         content="website">
  <meta property="og:title"        content="Safa Omra — Pré-Réservation Ramadan 2027">
  <meta property="og:description"  content="Réservez votre place pour l'Omra Ramadan 2027. Formulaire rapide et sécurisé — Safa Omra, l'autre vision de la Omra.">
  <meta property="og:image"        content="https://safa-omra.github.io/pre-reservation-ramadan/logo_safa.jpg">
  <meta property="og:url"          content="https://safa-omra.github.io/pre-reservation-ramadan">
  <meta property="og:image:width"  content="480">
  <meta property="og:image:height" content="480">
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="Safa Omra — Pré-Réservation Ramadan 2027">
  <meta name="twitter:description" content="Réservez votre place pour l'Omra Ramadan 2027.">
  <meta name="twitter:image"       content="https://safa-omra.github.io/pre-reservation-ramadan/logo_safa.jpg">

  <link rel="icon" href="logo_safa.jpg">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --vert : #3b5323;
      --or   : #C4A05A;
      --bg   : #f4f1eb;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      padding: 48px 32px;
      max-width: 360px;
      width: 100%;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin: 0 auto 20px;
      display: block;
      animation: appear .6s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    h1 {
      color: var(--vert);
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 4px;
      animation: appear .7s ease both;
    }

    .tagline {
      color: var(--or);
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .5px;
      margin-bottom: 28px;
      animation: appear .8s ease both;
    }

    /* Barre de progression */
    .bar-wrap {
      background: #e0d9cc;
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 16px;
      animation: appear .9s ease both;
    }

    .bar {
      height: 100%;
      background: linear-gradient(90deg, var(--vert), var(--or));
      border-radius: 99px;
      width: 0%;
      transition: width 1.6s cubic-bezier(.4,0,.2,1);
    }

    .msg {
      color: #888;
      font-size: .88rem;
      animation: appear 1s ease both;
    }

    /* Lien de secours (affiché si redirect échoue) */
    .fallback {
      display: none;
      margin-top: 24px;
    }

    .fallback a {
      display: inline-block;
      background: var(--vert);
      color: #fff;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
    }
  </style>
</head>
<body>

<div class="card">
  <img class="logo" src="logo_safa.jpg" alt="Safa Omra">
  <h1>Safa Omra</h1>
  <p class="tagline">— L'autre vision de la Omra —</p>

  <div class="bar-wrap">
    <div class="bar" id="bar"></div>
  </div>
  <p class="msg" id="msg">Ouverture du formulaire…</p>

  <!-- Affiché uniquement si la redirection prend trop de temps -->
  <div class="fallback" id="fallback">
    <a id="fallbackLink" href="#">Accéder au formulaire →</a>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
//  Packs disponibles — ajouter une ligne par nouveau voyage
// ══════════════════════════════════════════════════════════
var BASE_URL    = "https://script.google.com/macros/s/AKfycbweUWXKYozNVwkajFkwASL_oNPnflvpDQS8xrTKYzORqcaHG0LLu-wNgk9J2XZKrV58/exec";
var PLANNING_ID = "1n8bcvZnD1933k2RsYUh9f5MkSfosxdikISYO_-HcI0M";

var PACKS = {
  "ramadan-2027": {
    planning_id:    PLANNING_ID,
    onglet_confort: "Omra Ramadan 2027",
    onglet_eco:     "Omra Ramadan 2027"
  }
  // Ajouter d'autres voyages ici :
  // "chaabane-2027": {
  //   planning_id:    PLANNING_ID,
  //   onglet_confort: "Omra Chaabane 2027",
  //   onglet_eco:     "Omra Chaabane 2027"
  // }
};

var params  = new URLSearchParams(window.location.search);
var packKey = params.get("pack") || "ramadan-2027";
var pack    = PACKS[packKey];

if (!pack) {
  document.getElementById("msg").textContent = "Lien invalide — contactez Safa Omra.";
} else {
  var url = BASE_URL
    + "?planning_id="    + encodeURIComponent(pack.planning_id)
    + "&onglet_confort=" + encodeURIComponent(pack.onglet_confort)
    + "&onglet_eco="     + encodeURIComponent(pack.onglet_eco);

  // Affiche le lien de secours
  document.getElementById("fallbackLink").href = url;

  // Lance la barre de progression
  setTimeout(function () {
    document.getElementById("bar").style.width = "100%";
  }, 80);

  // Redirige après 1,8 s (laisse le temps à la barre de finir)
  setTimeout(function () {
    window.location.replace(url);
  }, 1800);

  // Si la redirection n'a pas eu lieu après 5 s, affiche le lien manuel
  setTimeout(function () {
    document.getElementById("fallback").style.display = "block";
    document.getElementById("msg").textContent = "Cliquez ci-dessous si la page ne s'ouvre pas automatiquement.";
  }, 5000);
}
</script>

</body>
</html>
