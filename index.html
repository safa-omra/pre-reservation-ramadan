<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Safa Omra — Pré-Réservation Ramadan 2027</title>

  <!-- ══ WhatsApp / réseaux sociaux ══ -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Safa Omra — Pré-Réservation Ramadan 2027">
  <meta property="og:description" content="Réservez votre place pour l'Omra Ramadan 2027. Formulaire rapide et sécurisé — Safa Omra, l'autre vision de la Omra.">
  <meta property="og:image"       content="https://safa-omra.github.io/pre-reservation-ramadan/logo_safa.jpg">
  <meta property="og:url"         content="https://safa-omra.github.io/pre-reservation-ramadan">
  <meta property="og:image:width"  content="480">
  <meta property="og:image:height" content="480">
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="Safa Omra — Pré-Réservation Ramadan 2027">
  <meta name="twitter:description" content="Réservez votre place pour l'Omra Ramadan 2027.">
  <meta name="twitter:image"       content="https://safa-omra.github.io/pre-reservation-ramadan/logo_safa.jpg">

  <!-- Favicon -->
  <link rel="icon" href="logo_safa.jpg">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --vert:  #3B5323;   /* vert forêt logo SAFA */
      --or:    #C4A05A;   /* or sablé logo */
      --bg:    #f4f1eb;   /* fond sable très clair */
      --vert2: #4a6630;   /* vert hover */
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* ── Bandeau top ── */
    header {
      background: var(--vert);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,.35);
      gap: 10px;
    }

    .logo-zone {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .logo-zone img {
      height: 48px;
      width: 48px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
      padding: 3px;
      display: block;
    }

    .logo-text {
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .logo-text small {
      display: block;
      font-size: .68rem;
      font-weight: 400;
      color: var(--or);
      letter-spacing: .4px;
    }

    .secure-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      color: rgba(255,255,255,.8);
      font-size: .75rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .secure-badge svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* ── Iframe wrapper ── */
    .frame-wrap {
      position: relative;
      height: calc(100vh - 64px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── Loader ── */
    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--bg);
      z-index: 10;
      transition: opacity .4s;
    }

    #loader.hidden { opacity: 0; pointer-events: none; }

    #loader img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(.9); opacity: .7; }
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #d5c9b0;
      border-top-color: var(--vert);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loader p {
      color: var(--vert);
      font-weight: 600;
      font-size: .95rem;
    }

    /* ── Message erreur ── */
    #errMsg {
      display: none;
      text-align: center;
      padding: 60px 24px;
      color: #555;
    }

    #errMsg h2 { color: var(--vert); margin-bottom: 10px; }

    #errMsg a {
      display: inline-block;
      margin-top: 20px;
      background: var(--vert);
      color: #fff;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

<!-- ══ BANDEAU ══ -->
<header>
  <div class="logo-zone">
    <img src="logo_safa.jpg" alt="Logo Safa Omra">
    <div class="logo-text">
      Safa Omra
      <small>L'autre vision de la Omra</small>
    </div>
  </div>
  <div class="secure-badge">
    <!-- Icône bouclier -->
    <svg viewBox="0 0 24 24" fill="none" stroke="#C4A05A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L4 5v6c0 5.25 3.4 10.15 8 11.35C16.6 21.15 20 16.25 20 11V5l-8-3z"/>
      <polyline points="9 12 11 14 15 10"/>
    </svg>
    Formulaire sécurisé
  </div>
</header>

<!-- ══ CONTENU ══ -->
<div class="frame-wrap">

  <div id="loader">
    <img src="logo_safa.jpg" alt="Safa Omra">
    <div class="spinner"></div>
    <p>Chargement du formulaire…</p>
  </div>

  <div id="errMsg">
    <h2>Formulaire introuvable</h2>
    <p>Le lien que vous avez utilisé semble invalide.<br>
       Contactez-nous à <strong>safaomra.fr@gmail.com</strong></p>
    <a href="mailto:safaomra.fr@gmail.com">Nous contacter</a>
  </div>

  <iframe
    id="formFrame"
    title="Formulaire de pré-réservation Safa Omra"
    scrolling="yes"
  ></iframe>

</div>

<script>
// ══════════════════════════════════════════════════════════
//  Packs disponibles — ajouter une ligne par nouveau voyage
// ══════════════════════════════════════════════════════════
var BASE_URL    = "https://script.google.com/macros/s/AKfycbweUWXKYozNVwkajFkwASL_oNPnflvpDQS8xrTKYzORqcaHG0LLu-wNgk9J2XZKrV58/exec";
var PLANNING_ID = "1n8bcvZnD1933k2RsYUh9f5MkSfosxdikISYO_-HcI0M";

var PACKS = {
  "ramadan-2027": {
    planning_id:    PLANNING_ID,
    onglet_confort: "Omra Ramadan 2027",
    onglet_eco:     "Omra Ramadan 2027"
  }
  // "chaabane-2027": {
  //   planning_id:    PLANNING_ID,
  //   onglet_confort: "Omra Chaabane 2027",
  //   onglet_eco:     "Omra Chaabane 2027"
  // }
};

var params  = new URLSearchParams(window.location.search);
var packKey = params.get("pack") || "ramadan-2027";
var pack    = PACKS[packKey];
var frame   = document.getElementById("formFrame");
var loader  = document.getElementById("loader");
var errMsg  = document.getElementById("errMsg");

if (!pack) {
  loader.classList.add("hidden");
  errMsg.style.display = "block";
} else {
  var url = BASE_URL
    + "?planning_id="    + encodeURIComponent(pack.planning_id)
    + "&onglet_confort=" + encodeURIComponent(pack.onglet_confort)
    + "&onglet_eco="     + encodeURIComponent(pack.onglet_eco);

  frame.src = url;
  frame.addEventListener("load", function () { loader.classList.add("hidden"); });
  setTimeout(function () { loader.classList.add("hidden"); }, 12000);
}
</script>

</body>
</html>
